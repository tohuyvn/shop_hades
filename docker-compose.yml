services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shop_hades_app
    restart: unless-stopped
    volumes:
      - .:/var/www/html
    environment:
      DB_HOST: db
      DB_DATABASE: ${DOCKER_DB_DATABASE:-shop_hades}
      DB_USERNAME: ${DOCKER_DB_USERNAME:-hades_user}
      DB_PASSWORD: ${DOCKER_DB_PASSWORD:-hades_password}
    depends_on:
      db:
        condition: service_healthy

  web:
    image: nginx:alpine
    container_name: shop_hades_web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: shop_hades_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DOCKER_DB_DATABASE:-shop_hades}
      MYSQL_USER: ${DOCKER_DB_USERNAME:-hades_user}
      MYSQL_PASSWORD: ${DOCKER_DB_PASSWORD:-hades_local_password}
      MYSQL_RANDOM_ROOT_PASSWORD: 'yes'
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: shop_hades_tunnel
    restart: unless-stopped
    command: tunnel --url http://web:80
    depends_on:
      - web

volumes:
  dbdata:
